    scene_tag: "trending_with_hooks_search"
    required_slots: ["platform", "genre"]
    clarification_reason: "platform_or_genre_missing"
    tool_plan:
      - mode: "serial"
        tools: ["search_trending_creatives", "get_trending_hooks"]
    queries:
      - "我需要看看最近{platform}上puzzle游戏的热门钩子"
