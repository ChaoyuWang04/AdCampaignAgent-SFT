workflow_id: 1
workflow_name: "素材搜寻"
count: 360
clarify_probability: 0.2
variables:
  competitors: ["Playrix", "Rollic", "Voodoo", "Jam City", "SciPlay"]
intent_buckets:
  competitor_ads:
    scene_tag: "competitor_ads_search"
    required_slots: ["platform"]
    clarification_reason: "platform_missing"
    tool_plan:
      - mode: "serial"
        tools: ["search_competitor_ads"]
    queries:
      - "查一下{competitor}最近在{platform}上投了什么广告"
      - "搜一下竞品{competitor}在{platform}的广告创意"
