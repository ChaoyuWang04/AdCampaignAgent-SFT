      - "想看一下{competitor}近期在{platform}的投放素材风格"
  trending_creatives:
    scene_tag: "trending_creatives_search"
    required_slots: ["platform", "genre"]
    clarification_reason: "platform_or_genre_missing"
    tool_plan:
      - mode: "serial"
        tools: ["search_trending_creatives"]
