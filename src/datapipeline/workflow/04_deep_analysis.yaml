    - "老板问新上的{campaign_id}目前表现如何，这么短时间能判断吗"
    - "{campaign_id}刚上线不久，我现在复盘会不会太早"
    - "这个{campaign_id}数据样本还很少，现阶段能给什么结论"
    - "产品那边问{campaign_id}是不是有问题，但它才上线几天，帮我判断下"
    - "帮我看看{campaign_id}现在这些早期数据能分析到什么程度"
