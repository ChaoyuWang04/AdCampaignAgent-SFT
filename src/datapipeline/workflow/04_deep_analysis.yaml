    - "{campaign_id}预算消耗只有目标的60%，怎么回事？"
    - "{campaign_id}最近明显花不动预算了，帮我看下卡在哪里"
    - "老板问为什么{campaign_id}这周欠量这么严重，帮我拆一下"
    - "我自己看数据发现{campaign_id}消耗拉不上去，帮我分析原因"
    - "{campaign_id}出价没怎么动，但最近就是起不来量，帮我看一下"
    - "月底要冲量，结果{campaign_id}预算完全花不出去，帮我判断问题"
